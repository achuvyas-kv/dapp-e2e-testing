name: 🧑‍🔧 Test

on:
  push:
    branches:
      - main
      - dev
      - develop
  pull_request:
    branches:
      - main
      - dev
      - develop
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  SEED_PHRASE: "test test test test test test test test test test test junk"
  PASSWORD: "Tester@1234"

jobs:
  test-unit:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run unit tests (if available)
        run: |
          if npm run | grep -q "test:unit"; then
            npm run test:unit
          else
            echo "No unit tests found, skipping..."
          fi

  test-e2e-headful-metamask:
    name: Run E2E tests - MetaMask (headful)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright dependencies
        run: npx playwright install-deps

      - name: Install browsers for Playwright
        run: npx playwright install chromium

      - name: Build project
        run: npm run build

      - name: Install linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
          xvfb curl

      - name: Start local blockchain (Hardhat)
        run: |
          echo "Starting Hardhat node..."
          npm run hardhat:node > hardhat.log 2>&1 &
          HARDHAT_PID=$!
          
          # Quick wait for Hardhat to start
          echo "Waiting for Hardhat node..."
          sleep 20
          echo "✅ Hardhat node started"
        env:
          CI: true

      - name: Start development server
        run: |
          echo "Starting dev server..."
          npm run dev > dev.log 2>&1 &
          # Quick wait for dev server to start
          echo "Waiting for dev server..."
          sleep 12
          echo "✅ Dev server started"
        env:
          CI: true

      - name: Build Synpress cache (MetaMask)
        run: |
          echo "Building Synpress cache..."
          timeout 120s xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" npm run cache:build
          if [ $? -eq 0 ]; then
            echo "✅ Synpress cache built successfully"
          else
            echo "❌ Synpress cache build failed or timed out"
            exit 1
          fi
        env:
          SEED_PHRASE: ${{ env.SEED_PHRASE }}
          PASSWORD: ${{ env.PASSWORD }}
          CI: true

      - name: Run E2E tests (headful)
        run: |
          echo "Running MetaMask E2E tests..."
          timeout 600s xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" \
            npm run test:metamask:extended
        env:
          SEED_PHRASE: ${{ env.SEED_PHRASE }}
          PASSWORD: ${{ env.PASSWORD }}
          CI: true
        continue-on-error: true

      - name: Archive Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metamask-test-results
          path: |
            playwright-report/
            test-results/
            hardhat.log
            dev.log
          if-no-files-found: warn
          retention-days: 30

  test-e2e-basic:
    name: Run basic E2E tests (no wallet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright dependencies
        run: npx playwright install-deps

      - name: Install browsers for Playwright
        run: npx playwright install chromium

      - name: Build project
        run: npm run build

      - name: Install linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
          xvfb curl

      - name: Start development server
        run: |
          echo "Starting dev server..."
          npm run dev > dev.log 2>&1 &
          # Quick wait for dev server to start
          echo "Waiting for dev server..."
          sleep 12
          echo "✅ Dev server started"
        env:
          CI: true

      - name: Run basic E2E tests (no MetaMask)
        run: |
          echo "Running basic E2E tests..."
          xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" \
            npm run test:basic
        env:
          CI: true

      - name: Archive basic test report
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: playwright-report-basic
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30
