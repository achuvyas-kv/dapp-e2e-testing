name: 🎯 Manual E2E Testing

on:
  workflow_dispatch:
    inputs:
      test_pattern:
        description: 'Test pattern to run (e.g., tests/basic.spec.ts or tests/)'
        required: false
        default: 'tests/'
        type: string
      headed:
        description: 'Run tests in headed mode (visible browser)'
        required: false
        default: false
        type: boolean
      environment:
        description: 'Environment to test against'
        required: false
        default: 'local'
        type: choice
        options:
          - local
          - staging
          - production

env:
  NODE_VERSION: '18'

jobs:
  manual-e2e:
    name: 🧪 Manual E2E Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 🔧 Install dependencies
        run: npm ci

      - name: 🗂️ Cache Synpress
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/synpress
            .cache-synpress
          key: synpress-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            synpress-cache-${{ runner.os }}-

      - name: 🏗️ Build Synpress cache
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" -- npx synpress test/wallet-setup
        env:
          SEED_PHRASE: ${{ secrets.SEED_PHRASE || 'test test test test test test test test test test test junk' }}
          PASSWORD: ${{ secrets.PASSWORD || 'Tester@1234' }}

      - name: 🔧 Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: 🏗️ Build application
        run: npm run build

      - name: 🚀 Start Hardhat node (if local environment)
        if: ${{ inputs.environment == 'local' }}
        run: |
          npm run hardhat:node &
          sleep 10
        env:
          CI: true

      - name: 🧪 Run E2E tests
        run: |
          if [ "${{ inputs.headed }}" = "true" ]; then
            echo "Running tests in headed mode..."
            xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" -- npx playwright test ${{ inputs.test_pattern }} --headed
          else
            echo "Running tests in headless mode..."
            xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" -- npx playwright test ${{ inputs.test_pattern }}
          fi
        env:
          SEED_PHRASE: ${{ secrets.SEED_PHRASE || 'test test test test test test test test test test test junk' }}
          PASSWORD: ${{ secrets.PASSWORD || 'Tester@1234' }}
          TEST_ENVIRONMENT: ${{ inputs.environment }}
          CI: true

      - name: 📊 Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-test-results-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          retention-days: 30

      - name: 📝 Create job summary
        if: always()
        run: |
          echo "## 🎯 Manual Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Pattern**: \`${{ inputs.test_pattern }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Headed Mode**: ${{ inputs.headed }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow Run**: [\#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "test-results/results.json" ]; then
            echo "### Test Results" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            cat test-results/results.json >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
