name: 🧪 Matrix E2E Testing

on:
  workflow_dispatch:
    inputs:
      test_environments:
        description: 'Environments to test (comma-separated)'
        required: false
        default: 'local,staging'
        type: string
      browsers:
        description: 'Browsers to test (comma-separated)'
        required: false
        default: 'chromium'
        type: string
  schedule:
    # Run comprehensive matrix tests weekly on Sundays at 3 AM UTC
    - cron: '0 3 * * 0'

env:
  NODE_VERSION: '18'

jobs:
  prepare-matrix:
    name: 🔧 Prepare Test Matrix
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.matrix.outputs.environments }}
      browsers: ${{ steps.matrix.outputs.browsers }}
    
    steps:
      - name: 🔧 Prepare matrix
        id: matrix
        run: |
          # Default values for scheduled runs
          if [ "${{ github.event_name }}" = "schedule" ]; then
            environments='["local", "staging"]'
            browsers='["chromium", "firefox"]'
          else
            # Parse manual input
            envs="${{ inputs.test_environments || 'local,staging' }}"
            browsers_input="${{ inputs.browsers || 'chromium' }}"
            
            # Convert comma-separated to JSON array
            environments=$(echo "$envs" | jq -Rc 'split(",") | map(select(length > 0))')
            browsers=$(echo "$browsers_input" | jq -Rc 'split(",") | map(select(length > 0))')
          fi
          
          echo "environments=$environments" >> $GITHUB_OUTPUT
          echo "browsers=$browsers" >> $GITHUB_OUTPUT
          
          echo "Testing environments: $environments"
          echo "Testing browsers: $browsers"

  matrix-tests:
    name: 🧪 E2E Tests (${{ matrix.environment }}, ${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: prepare-matrix
    
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.prepare-matrix.outputs.environments) }}
        browser: ${{ fromJson(needs.prepare-matrix.outputs.browsers) }}
    
    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 🔧 Install dependencies
        run: npm ci

      - name: 🗂️ Cache Synpress
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/synpress
            .cache-synpress
          key: synpress-cache-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            synpress-cache-${{ runner.os }}-${{ matrix.browser }}-
            synpress-cache-${{ runner.os }}-

      - name: 🏗️ Build Synpress cache
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" -- npx synpress test/wallet-setup
        env:
          SEED_PHRASE: ${{ secrets.SEED_PHRASE || 'test test test test test test test test test test test junk' }}
          PASSWORD: ${{ secrets.PASSWORD || 'Tester@1234' }}

      - name: 🔧 Install Playwright browsers
        run: |
          if [ "${{ matrix.browser }}" = "chromium" ]; then
            npx playwright install --with-deps chromium
          elif [ "${{ matrix.browser }}" = "firefox" ]; then
            npx playwright install --with-deps firefox
          elif [ "${{ matrix.browser }}" = "webkit" ]; then
            npx playwright install --with-deps webkit
          else
            npx playwright install --with-deps
          fi

      - name: 🏗️ Build application
        run: npm run build

      - name: 🌐 Configure environment
        run: |
          case "${{ matrix.environment }}" in
            "local")
              echo "BASE_URL=http://localhost:5173" >> $GITHUB_ENV
              echo "NETWORK=hardhat" >> $GITHUB_ENV
              ;;
            "staging")
              echo "BASE_URL=${{ secrets.STAGING_URL || 'http://localhost:5173' }}" >> $GITHUB_ENV
              echo "NETWORK=sepolia" >> $GITHUB_ENV
              ;;
            "production")
              echo "BASE_URL=${{ secrets.PRODUCTION_URL || 'http://localhost:5173' }}" >> $GITHUB_ENV
              echo "NETWORK=mainnet" >> $GITHUB_ENV
              ;;
          esac

      - name: 🚀 Start Hardhat node (local environment only)
        if: matrix.environment == 'local'
        run: |
          npm run hardhat:node &
          sleep 10
        env:
          CI: true

      - name: 🧪 Run E2E tests
        run: |
          # Configure Playwright to use specific browser
          export PLAYWRIGHT_BROWSER="${{ matrix.browser }}"
          
          # Run tests with environment-specific configuration
          xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" -- npx playwright test \
            --project=${{ matrix.browser }} \
            --reporter=html,json \
            --output-dir=test-results-${{ matrix.environment }}-${{ matrix.browser }}
        env:
          SEED_PHRASE: ${{ secrets.SEED_PHRASE || 'test test test test test test test test test test test junk' }}
          PASSWORD: ${{ secrets.PASSWORD || 'Tester@1234' }}
          TEST_ENVIRONMENT: ${{ matrix.environment }}
          CI: true

      - name: 📊 Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.environment }}-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results-${{ matrix.environment }}-${{ matrix.browser }}/
            results.json
          retention-days: 30

      - name: 📈 Generate test summary
        if: always()
        run: |
          echo "## 🧪 Matrix Test Results: ${{ matrix.environment }} + ${{ matrix.browser }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Browser**: ${{ matrix.browser }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Base URL**: ${{ env.BASE_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Network**: ${{ env.NETWORK }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "results.json" ]; then
            # Extract basic stats from results
            if command -v jq >/dev/null 2>&1; then
              total=$(jq '.stats.total // 0' results.json)
              passed=$(jq '.stats.passed // 0' results.json)
              failed=$(jq '.stats.failed // 0' results.json)
              skipped=$(jq '.stats.skipped // 0' results.json)
              
              echo "### Test Statistics" >> $GITHUB_STEP_SUMMARY
              echo "- **Total**: $total" >> $GITHUB_STEP_SUMMARY
              echo "- **Passed**: ✅ $passed" >> $GITHUB_STEP_SUMMARY
              echo "- **Failed**: ❌ $failed" >> $GITHUB_STEP_SUMMARY
              echo "- **Skipped**: ⏭️ $skipped" >> $GITHUB_STEP_SUMMARY
            fi
          fi

  consolidate-results:
    name: 📊 Consolidate Matrix Results
    if: always()
    needs: matrix-tests
    runs-on: ubuntu-latest
    
    steps:
      - name: 📂 Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-results

      - name: 📊 Generate consolidated report
        run: |
          echo "# 🧪 Matrix Testing Results Summary" > matrix-report.md
          echo "" >> matrix-report.md
          echo "**Workflow Run**: [\#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> matrix-report.md
          echo "**Date**: $(date -u)" >> matrix-report.md
          echo "" >> matrix-report.md
          
          echo "## Test Matrix" >> matrix-report.md
          echo "" >> matrix-report.md
          
          # List all test combinations
          echo "| Environment | Browser | Status | Artifacts |" >> matrix-report.md
          echo "|-------------|---------|--------|-----------|" >> matrix-report.md
          
          # Process each artifact directory
          for dir in all-results/test-results-*; do
            if [ -d "$dir" ]; then
              basename=$(basename "$dir")
              env_browser=${basename#test-results-}
              env=${env_browser%-*}
              browser=${env_browser##*-}
              
              # Check if results.json exists to determine status
              if [ -f "$dir/results.json" ]; then
                status="✅ Completed"
              else
                status="❌ Failed"
              fi
              
              echo "| $env | $browser | $status | [$basename](./$basename/) |" >> matrix-report.md
            fi
          done
          
          echo "" >> matrix-report.md
          echo "## Detailed Results" >> matrix-report.md
          echo "" >> matrix-report.md
          echo "Download individual artifacts above for detailed test reports, screenshots, and traces." >> matrix-report.md

      - name: 📤 Upload consolidated report
        uses: actions/upload-artifact@v4
        with:
          name: matrix-testing-report
          path: |
            matrix-report.md
            all-results/
          retention-days: 90

      - name: 📝 Create issue on failures
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 Matrix E2E Tests Failed';
            const body = `
            The scheduled matrix E2E tests have encountered failures.
            
            **Test Matrix Details:**
            - Environments: ${{ needs.prepare-matrix.outputs.environments }}
            - Browsers: ${{ needs.prepare-matrix.outputs.browsers }}
            
            **Run Details:**
            - Workflow: ${context.workflow}
            - Run ID: ${context.runId}
            - Run Number: ${context.runNumber}
            - Commit: ${context.sha}
            
            **View Results:**
            ${context.payload.repository.html_url}/actions/runs/${context.runId}
            
            Please investigate the failing test combinations and fix the issues.
            `;
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug', 'e2e-tests', 'matrix-testing', 'automated']
            });
