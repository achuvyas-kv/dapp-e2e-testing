name: 🕐 Scheduled E2E Tests

on:
  schedule:
    # Run tests every day at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  NODE_VERSION: '18'

jobs:
  scheduled-e2e:
    name: 🧪 Scheduled E2E Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 🔧 Install dependencies
        run: npm ci

      - name: 🗂️ Cache Synpress
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/synpress
            .cache-synpress
          key: synpress-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            synpress-cache-${{ runner.os }}-

      - name: 🏗️ Build Synpress cache
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" -- npx synpress test/wallet-setup
        env:
          SEED_PHRASE: ${{ secrets.SEED_PHRASE || 'test test test test test test test test test test test junk' }}
          PASSWORD: ${{ secrets.PASSWORD || 'Tester@1234' }}

      - name: 🔧 Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: 🏗️ Build application
        run: npm run build

      - name: 🚀 Start Hardhat node
        run: |
          npm run hardhat:node &
          sleep 10
        env:
          CI: true

      - name: 🧪 Run comprehensive E2E tests
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" -- npx playwright test --reporter=html,json
        env:
          SEED_PHRASE: ${{ secrets.SEED_PHRASE || 'test test test test test test test test test test test junk' }}
          PASSWORD: ${{ secrets.PASSWORD || 'Tester@1234' }}
          CI: true

      - name: 📊 Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduled-test-results-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
            results.json
          retention-days: 90

      - name: 📧 Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 Scheduled E2E Tests Failed';
            const body = `
            The scheduled E2E tests have failed.
            
            **Run Details:**
            - Workflow: ${context.workflow}
            - Run ID: ${context.runId}
            - Run Number: ${context.runNumber}
            - Branch: ${context.ref}
            - Commit: ${context.sha}
            
            **View Results:**
            ${context.payload.repository.html_url}/actions/runs/${context.runId}
            
            Please investigate and fix the failing tests.
            `;
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug', 'e2e-tests', 'automated']
            });

      - name: 📈 Create test summary
        if: always()
        run: |
          echo "## 🕐 Scheduled E2E Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Date**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow Run**: [\#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "results.json" ]; then
            echo "### Detailed Results" >> $GITHUB_STEP_SUMMARY
            echo "Check the artifacts for detailed test reports and traces." >> $GITHUB_STEP_SUMMARY
          fi
